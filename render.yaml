# Render Blueprint. You can also create the Web Service in the dashboard
# with the same build/start commands.
services:
  - type: web
    name: document-assistant-api
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: LLM_PROVIDER
        value: openai
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_API_KEY
        sync: false
      - key: OCR_ENABLED
        value: "false"
      - key: TTS_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: ""
      - key: LOG_LEVEL
        value: INFO
